name: Export public ngspice 44.2.1 bundle
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public precompiled ngspice bundle
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v44.2.1 https://github.com/silicon-vlsi-org/eda-ngspice.git eda-ngspice
          chmod +x eda-ngspice/glnxa64/bin/ngspice
          export LD_LIBRARY_PATH="$PWD/eda-ngspice/glnxa64/lib"
          export SPICE_LIB_DIR="$PWD/eda-ngspice/glnxa64/share/ngspice"
          eda-ngspice/glnxa64/bin/ngspice --version | tee eda-ngspice/glnxa64/NGSPICE_VERSION.txt
      - name: Upload public simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: ngspice-44.2.1-linux-x86_64
          path: eda-ngspice/glnxa64
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
